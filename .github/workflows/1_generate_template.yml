name: 🛠️ 1. Generate Project Template

on:
  workflow_dispatch:

jobs:
  generate_template:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse setup.json Configuration
        id: parse_json
        run: |
          APP_NAME=$(jq -r '.app_name' setup/setup.json)
          PACKAGE=$(jq -r '.package' setup/setup.json)
          JAVA_VER=$(jq -r '.java_version' setup/setup.json)
          CODEBASE=$(jq -r '.codebase' setup/setup.json)
          MODE=$(jq -r '.mode' setup/setup.json)
          PACKAGE_PATH=$(echo "$PACKAGE" | tr '.' '/')
          
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "PACKAGE=$PACKAGE" >> $GITHUB_ENV
          echo "JAVA_VER=$JAVA_VER" >> $GITHUB_ENV
          echo "CODEBASE=$CODEBASE" >> $GITHUB_ENV
          echo "MODE=$MODE" >> $GITHUB_ENV
          echo "PACKAGE_PATH=$PACKAGE_PATH" >> $GITHUB_ENV

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VER }}

      - name: Create Essential Android Directories
        run: |
          rm -rf source/android_code
          mkdir -p source/android_code/app/src/main/res/layout
          mkdir -p source/android_code/app/src/main/res/values
          mkdir -p source/android_code/gradle/wrapper
          mkdir -p source/android_code/app/src/main/java/${{ env.PACKAGE_PATH }}

      - name: Generate Core Project Files
        run: |
          cd source/android_code
          
          # 1. settings.gradle
          echo "rootProject.name = \"${{ env.APP_NAME }}\"" > settings.gradle
          echo "include ':app'" >> settings.gradle

          # 2. root build.gradle
          echo "buildscript {" > build.gradle
          echo "    repositories { google(); mavenCentral() }" >> build.gradle
          echo "    dependencies {" >> build.gradle
          echo "        classpath 'com.android.tools.build:gradle:8.2.2'" >> build.gradle
          if [ "${{ env.CODEBASE }}" = "kotlin" ]; then
              echo "        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'" >> build.gradle
          fi
          echo "    }" >> build.gradle
          echo "}" >> build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle

          # 3. app/build.gradle (বেস পার্ট)
          echo "apply plugin: 'com.android.application'" > app/build.gradle
          if [ "${{ env.CODEBASE }}" = "kotlin" ]; then 
              echo "apply plugin: 'kotlin-android'" >> app/build.gradle
          fi

          echo "android {" >> app/build.gradle
          echo "    namespace '${{ env.PACKAGE }}'" >> app/build.gradle
          echo "    compileSdk 34" >> app/build.gradle
          echo "    defaultConfig {" >> app/build.gradle
          echo "        applicationId '${{ env.PACKAGE }}'" >> app/build.gradle
          echo "        minSdk 21" >> app/build.gradle
          echo "        targetSdk 34" >> app/build.gradle
          echo "        versionCode 1" >> app/build.gradle
          echo "        versionName \"1.0\"" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle

          # 4. ডিপেন্ডেন্সি অংশ অ্যাপেন্ড করা (সেফ মেথড)
          echo "dependencies {" >> app/build.gradle
          echo "    implementation 'androidx.appcompat:appcompat:1.6.1'" >> app/build.gradle
          echo "    implementation 'com.google.android.material:material:1.11.0'" >> app/build.gradle
          echo "    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'" >> app/build.gradle
          
          # জেসন থেকে ডিপেন্ডেন্সি লুপ চালিয়ে ডাইরেক্ট রাইট
          jq -r '.dependencies[]' ../../setup/setup.json | while read -r lib; do
              if [ ! -z "$lib" ]; then
                  echo "    implementation '$lib'" >> app/build.gradle
              fi
          done
          echo "}" >> app/build.gradle

          # 5. AndroidManifest Mode (Mobile, TV vs ALL)
          TV_FEATURE=""
          INTENT_FILTERS=""

          if [ "${{ env.MODE }}" = "mobile" ]; then
             INTENT_FILTERS="<action android:name=\"android.intent.action.MAIN\" /><category android:name=\"android.intent.category.LAUNCHER\" />"
          elif [ "${{ env.MODE }}" = "tv" ]; then
             TV_FEATURE="<uses-feature android:name=\"android.software.leanback\" android:required=\"false\"/><uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\"/>"
             INTENT_FILTERS="<action android:name=\"android.intent.action.MAIN\" /><category android:name=\"android.intent.category.LEANBACK_LAUNCHER\" />"
          elif [ "${{ env.MODE }}" = "all" ]; then
             TV_FEATURE="<uses-feature android:name=\"android.software.leanback\" android:required=\"false\"/>"
             INTENT_FILTERS="<action android:name=\"android.intent.action.MAIN\" /><category android:name=\"android.intent.category.LAUNCHER\" /><category android:name=\"android.intent.category.LEANBACK_LAUNCHER\" />"
          fi

          # AndroidManifest.xml জেনারেট
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.github.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              $TV_FEATURE
              <application
                  android:allowBackup="true"
                  android:label="${{ env.APP_NAME }}"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          $INTENT_FILTERS
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity জেনারেট
          if [ "${{ env.CODEBASE }}" = "kotlin" ]; then
          cat <<EOF > app/src/main/java/${{ env.PACKAGE_PATH }}/MainActivity.kt
          package ${{ env.PACKAGE }}
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF
          else
          cat <<EOF > app/src/main/java/${{ env.PACKAGE_PATH }}/MainActivity.java
          package ${{ env.PACKAGE }};
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          EOF
          fi

          # activity_main.xml Layout
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.github.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="Template Ready" android:layout_centerInParent="true"/>
          </RelativeLayout>
          EOF

          # gradle.properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Inject Official Gradle Wrapper and JAR
        run: |
          cd source/android_code
          mkdir -p gradle/wrapper
          wget https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -O gradlew
          chmod +x gradlew
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip" > gradle/wrapper/gradle-wrapper.properties
          wget https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar

      - name: Push All Required Files to Github
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add source/android_code
          git commit -m "🚀 Pushed All Essential Android Project Files with Gradle JAR" || echo "No changes"
          git push origin main
