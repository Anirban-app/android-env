name: 📦 2. Compile and Build App

on:
  workflow_dispatch:

jobs:
  build_project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Environment Variables
        run: |
          JAVA_VER=$(jq -r '.java_version' setup/setup.json)
          APP_NAME=$(jq -r '.app_name' setup/setup.json)
          CODEBASE=$(jq -r '.codebase' setup/setup.json)
          PACKAGE=$(jq -r '.package' setup/setup.json)
          
          echo "JAVA_VER=$JAVA_VER" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "CODEBASE=$CODEBASE" >> $GITHUB_ENV
          echo "PACKAGE=$PACKAGE" >> $GITHUB_ENV

      - name: Set up JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VER }}
          cache: 'gradle'

      - name: Sync and Inject Latest Dependencies to Gradle
        run: |
          TARGET_FILE="source/android_code/app/build.gradle"
          
          # ১. বেস অংশ ফ্রেশ করে রি-রাইট করা
          echo "apply plugin: 'com.android.application'" > $TARGET_FILE
          if [ "${{ env.CODEBASE }}" = "kotlin" ]; then 
              echo "apply plugin: 'kotlin-android'" >> $TARGET_FILE
          fi

          echo "android {" >> $TARGET_FILE
          echo "    namespace '${{ env.PACKAGE }}'" >> $TARGET_FILE
          echo "    compileSdk 34" >> $TARGET_FILE
          echo "    defaultConfig {" >> $TARGET_FILE
          echo "        applicationId '${{ env.PACKAGE }}'" >> $TARGET_FILE
          echo "        minSdk 21" >> $TARGET_FILE
          echo "        targetSdk 34" >> $TARGET_FILE
          echo "        versionCode 1" >> $TARGET_FILE
          echo "        versionName \"1.0\"" >> $GITHUB_ENV
          echo "        versionName \"1.0\"" >> $TARGET_FILE
          echo "    }" >> $TARGET_FILE
          echo "}" >> $TARGET_FILE

          # ২. ডিপেন্ডেন্সি ব্লক নতুন জেসন অনুযায়ী বসানো
          echo "dependencies {" >> $TARGET_FILE
          echo "    implementation 'androidx.appcompat:appcompat:1.6.1'" >> $TARGET_FILE
          echo "    implementation 'com.google.android.material:material:1.11.0'" >> $TARGET_FILE
          echo "    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'" >> $TARGET_FILE
          
          # জেসন ফাইল থেকে সরাসরি রিড করে রাইট করা
          jq -r '.dependencies[]' setup/setup.json | while read -r lib; do
              if [ ! -z "$lib" ]; then
                  echo "    implementation '$lib'" >> $TARGET_FILE
              fi
          done
          echo "}" >> $TARGET_FILE
          echo "Dependencies synchronized successfully with setup.json"

      - name: Grant Execute Permission
        run: chmod +x source/android_code/gradlew

      - name: Run Clean Gradle Build
        run: |
          cd source/android_code
          ./gradlew assembleDebug --no-daemon

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-build
          path: source/android_code/app/build/outputs/apk/debug/app-debug.apk
